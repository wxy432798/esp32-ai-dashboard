services:
  ai-usage:
    build: .
    container_name: esp32-ai-dashboard-backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./data:/app/data
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
